[project]
name = "agentwal"
version = "0.1.0"
description = "Crash-safe agent runs via a write-ahead journal: no duplicated side effects, no lost progress, no re-billed LLM calls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # the library itself is stdlib-only


[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentwal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
